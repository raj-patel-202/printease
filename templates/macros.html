{% macro printease_badge(tagline='Configure · Upload · Print', variant='page', show_tagline=true) %}
<div class="printease-badge printease-badge--{{ variant }}" role="contentinfo" aria-label="PrintEase">
  <div class="printease-badge__barcode" aria-hidden="true"></div>
  <p class="printease-badge__brand">PrintEase</p>
  {% if show_tagline and tagline %}
  <p class="printease-badge__tagline">{{ tagline }}</p>
  {% endif %}
</div>
{% endmacro %}
