{% extends "layout.html" %}

{% block active_nav %}
  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('contact') }}">Contact</a>
{% endblock %}

{% block content %}
<main class="page-wrapper dot-grid-bg">
  <div class="auth-container">

    <div class="auth-brand reveal">
      <h1>Log in to<br/><em>PrintEase</em></h1>
      <p>Access your orders, upload files, and manage your print jobs.</p>
    </div>

    <form method="post" id="loginForm" class="auth-card reveal">

      <div class="form-group">
        <label for="username">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="username" name="username"
                 placeholder="you@example.com" required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Enter your password" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">Log In</button>

      <div class="divider">or</div>

      <div class="auth-switch">
        Don't have an account? <a href="{{ url_for('register') }}">Create one →</a>
      </div>

    </form>

  </div>
</main>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ static_asset(request, path='js/login.js') }}"></script>
{% endblock %}
